<style>
:root{--bg:#eef2ee;--sf:#fff;--tx:#16241c;--mu:#55645b;--pr:#0b5d3b;--on:#fff;--ac:#e8b923;--bd:#cfd8d0;--rd:#b3261e;--hd:#0b3d2a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1713;--sf:#17231c;--tx:#e6efe8;--mu:#94a89b;--pr:#5cc08f;--on:#08150e;--bd:#2c3d33;--rd:#ff8f87}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1713;--sf:#17231c;--tx:#e6efe8;--mu:#94a89b;--pr:#5cc08f;--on:#08150e;--bd:#2c3d33;--rd:#ff8f87}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sf);z-index:10}
header{background:var(--hd);color:#fff;padding:16px 16px 12px;border-bottom:5px solid var(--rd)}
h1{margin:0;font:700 22px/1.2 Georgia,"Times New Roman",serif;letter-spacing:.02em}h1 i{color:var(--ac);font-style:normal}
header p{margin:4px 0 0;font-size:14px;opacity:.9}
.lg{width:56px;height:56px;object-fit:cover;border-radius:10px;vertical-align:middle;margin-right:8px}
header{position:relative}header h1{padding-right:46px}.hb{position:absolute;right:10px;top:12px;background:transparent;border:0;color:#fff;font-size:30px;line-height:1;padding:4px 10px;cursor:pointer;box-shadow:none}
.mbar{padding:12px 4px 0}.mback{background:var(--hd);color:#fff;border:0;border-radius:50%;width:44px;height:44px;font-size:22px;line-height:1;cursor:pointer}
.mlist{padding:6px 0 18px}.mbtn{display:block;width:78%;max-width:420px;margin:18px auto;padding:22px 12px;background:#dfe9e2;color:var(--hd);border:0;border-bottom:3px solid var(--ac);border-radius:4px;box-shadow:0 2px 5px rgba(0,0,0,.22);font:600 16px/1.2 Georgia,"Times New Roman",serif;letter-spacing:.03em;text-transform:uppercase;text-align:center;cursor:pointer}.mbtn:hover,.mbtn:active{background:var(--pr);color:#fff}
h2,h3{font-family:Georgia,"Times New Roman",serif;color:var(--pr);margin:.6em 0 .3em}
.demo{background:var(--ac);color:#1d1600;text-align:center;font-size:13px;font-weight:600;padding:6px 10px}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:var(--sf);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
nav button{flex:none}
main{max-width:860px;margin:0 auto;padding:12px 14px}
button{font:inherit;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:8px;padding:10px 14px;cursor:pointer;min-height:44px;margin:2px 0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--ac);outline-offset:1px}
button.p,nav button.on{background:var(--pr);color:var(--on);border-color:var(--pr)}
button.d{color:var(--rd)}
.card{background:var(--sf);border:1px solid var(--bd);border-left:4px solid var(--pr);border-radius:6px;padding:12px 14px;margin:10px 0}
.big{display:block;width:100%;text-align:left;margin:10px 0;padding:16px;border-left:4px solid var(--ac)}.big b{display:block;font-size:18px}.big span{color:var(--mu);font-size:14px}
input,select,textarea{font:inherit;width:100%;padding:10px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);margin:4px 0 10px}
label{font-size:14px;color:var(--mu)}
.g{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--bd);color:var(--tx)}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}td,th{border-bottom:1px solid var(--bd);padding:6px;text-align:left}
details{border-bottom:1px solid var(--bd);padding:8px 0}summary{cursor:pointer;font-weight:600}
.tabs{display:flex;gap:6px;overflow-x:auto}.tabs button{flex:none}
footer{max-width:860px;margin:0 auto;padding:10px 14px 28px;color:var(--mu);font-size:13px}

function spw(){if(!user)return;const a=$("#pw0").value,n=$("#pw1").value,c=$("#pw2").value,e=$("#pwe"),u=S.users.find(x=>x.id==user.id);
 if(!u||u.h!=H(a)){e.textContent="Le mot de passe actuel est incorrect.";return}
 if(n.length<8){e.textContent="Le nouveau mot de passe doit contenir au moins 8 caractères.";return}
 if(n!=c){e.textContent="Les deux nouveaux mots de passe ne sont pas identiques.";return}
 if(H(n)==u.h){e.textContent="Le nouveau mot de passe doit être différent de l’actuel.";return}

ation:none;padding-left:0;display:block}}\n.lg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.78rem;color:var(--mut);margin-top:10px}\n.lg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}\n.hint{font-size:.78rem;color:var(--mut);margin:8px 0 0}\n.wkh{margin-top:18px}\n[hidden]{display:none!important}\n#xt{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:8px;z-index:5}\n@media screen{.item{border-left-color:var(--k,var(--acc));background:color-mix(in srgb,var(--k,var(--acc)) 13%,var(--card))}}\n.tvn{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;max-width:980px;margin:12px auto 0;padding:0 16px;font-size:1.3rem}\n.tvn[hidden]{display:none!important}\n.tvn button{font-size:1.2rem;padding:8px 16px}\n#tvd{font-weight:bold;text-transform:capitalize;min-width:260px;text-align:center}\nbody.tv .np{display:none}\nbody.tv .grid{display:block}\nbody.tv #res,body.tv .item{font-size:1.5rem}\nbody.tv .item{padding:14px}\n.msg{white-space:pre-line}\n<\/style>\n<\/head>\n<body data-p=\"day\">\n<header>\n<div class=\"mq\"><h1>Calendrier des audiences – Cour d’appel de Ouagadougou<\/h1><\/div>\n<p id=\"sub\">Audiences ordinaires 2026 2027<\/p>\n<\/header>\n<main>\n<section class=\"card np\">\n<label class=\"l\" for=\"d\">Saisissez une date<\/label>\n<div class=\"row\">\n<button class=\"alt\" id=\"prev\" aria-label=\"Jour précédent\">◀<\/button>\n<input type=\"date\" id=\"d\">\n<button class=\"alt\" id=\"next\" aria-label=\"Jour suivant\">▶<\/button>\n<\/div>\n<div class=\"row\" style=\"margin-top:10px\">\n<button class=\"alt\" id=\"td\">Aujourd’hui<\/button>\n<label><input type=\"checkbox\" id=\"wk\"> Afficher la semaine<\/label>\n<button class=\"alt\" id=\"tv\">🖥 Mode affichage<\/button>\n<\/div>\n<div class=\"lg\" id=\"lg\"><\/div>\n<\/section>\n<div class=\"grid\">\n<section class=\"card res\" id=\"res\" aria-live=\"polite\"><\/section>\n<section class=\"card np\">\n<div class=\"cal-h\"><button class=\"alt\" id=\"pm\" aria-label=\"Mois précédent\">◀<\/button><b id=\"mt\"><\/b><button class=\"alt\" id=\"nm\" aria-label=\"Mois suivant\">▶<\/button><\/div>\n<div class=\"cal\" id=\"cal\"><\/div>\n<\/section>\n<\/div>\n<section class=\"card np\">\n<details>\n<summary>Afficher le calendrier complet<\/summary>\n<div class=\"wrap\" id=\"full\"><\/div>\n<\/details>\n<\/section>\n<section class=\"card notes np\" id=\"notes\"><\/section>\n<\/main>\n<div id=\"tvn\" class=\"tvn\" hidden>\n<button class=\"alt\" id=\"tp\" aria-label=\"Jour précédent\">◀<\/button>\n<span id=\"tvd\"><\/span>\n<button class=\"alt\" id=\"tn\" aria-label=\"Jour suivant\">▶<\/button>\n<button class=\"alt\" id=\"tt\">Aujourd’hui<\/button>\n<\/div>\n<button id=\"xt\" hidden>✕ Quitter l’affichage<\/button>\n<script>\nconst ORIG=__CALDATA__;\nlet DATA=ORIG,MONTHS=[];\nconst MN=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];\nconst DN=['lundi','mardi','mercredi','jeudi','vendredi','samedi','dimanche'];\nconst idx={};\nconst FM=['jan','fev','mar','avr','mai','juin','juil','aou','sep','oct','nov','dec'];\nfunction parseHeader(h){let y=0,pm=0;return h.slice(1).map(x=>{const s=x.normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toLowerCase();const mo=FM.findIndex(p=>s.includes(p))+1;const ym=/\\d{4}/.exec(s);if(!mo)return null;if(ym)y=+ym[0];else if(y&&mo<pm)y++;pm=mo;return y?[y,mo]:null})}\nfunction build(){\n for(const k in idx)delete idx[k];\n MONTHS=parseHeader(DATA.header).map(x=>x||[0,0]);\n DATA.groups.forEach((g,gi)=>g.rows.forEach(r=>{\n  for(let m=0;m<MONTHS.length;m++){\n   const c=(r[m+1]||'').trim(); if(!c) continue;\n   c.split('-').forEach(x=>{const k=MONTHS[m][0]+'-'+MONTHS[m][1]+'-'+parseInt(x,10);(idx[k]=idx[k]||[]).push({g:gi,label:r[0]});});\n  }\n }));\n}\nbuild();\nconst $=id=>document.getElementById(id);\nconst pad=n=>String(n).padStart(2,'0');\nconst iso=(y,m,d)=>y+'-'+pad(m)+'-'+pad(d);\nfunction key(y,m,d){return y+'-'+m+'-'+d}\nfunction el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}\nconst TYPES=[['Instruction',/instruction/,'#6b4e9b'],['Civiles',/civile/,'#1f6fb2'],['Commerciales',/commerciale/,'#c27a12'],['Correctionnelles',/correctionnelle/,'#b3261e'],['Sociales',/sociale/,'#1d6b3a'],['Autres chambres',/appel|arbitrage|enfants/,'#0e7c86'],['Premier Président',/./,'#a67c00']];\nconst colOf=l=>{const s=nz(l);return (TYPES.find(t=>t[1].test(s))||TYPES[6])[2]};\nfunction mkItem(l){const e=el('div','item',l);e.style.setProperty('--k',colOf(l));return e}\nfunction fmt(y,mo,d){const dt=new Date(y,mo-1,d);return DN[(dt.getDay()+6)%7]+' '+d+' '+MN[mo-1]+' '+y}\nconst per=()=>{const a=MONTHS[0],b=MONTHS[MONTHS.length-1];return MN[a[1]-1]+' '+a[0]+' à '+MN[b[1]-1]+' '+b[0]};\nlet view=0;\nfunction show(v){\n const box=$('res');box.innerHTML='';\n box.appendChild(el('h2',null,'Audiences prévues'));\n const m=/^(\\d{4})-(\\d{2})-(\\d{2})$/.exec(v);\n if(!m){box.appendChild(el('div','msg','Veuillez saisir une date valide.'));return}\n const y=+m[1],mo=+m[2],d=+m[3];\n const dt=new Date(y,mo-1,d);\n box.appendChild(el('p',null,DN[(dt.getDay()+6)%7]+' '+d+' '+MN[mo-1]+' '+y));\n const inR=MONTHS.some(a=>a[0]===y&&a[1]===mo);\n if(!inR){box.appendChild(el('div','msg','Cette date est hors de la période couverte par le calendrier ('+per()+').'));return}\n const list=idx[key(y,mo,d)]||[];\n if(!list.length)box.appendChild(el('div','msg','Aucune audience prévue à cette date dans le calendrier.'));\n DATA.groups.forEach((g,gi)=>{\n  const l=list.filter(a=>a.g===gi);\n  if(!l.length)return;\n  box.appendChild(el('h3',null,g.title));\n  l.forEach(a=>box.appendChild(mkItem(a.label)));\n });\n if($('wk').checked){\n  const mon=new Date(y,mo-1,d);mon.setDate(mon.getDate()-((mon.getDay()+6)%7));\n  box.appendChild(el('h2','wkh','Audiences de la semaine'));\n  for(let i=0;i<5;i++){\n   const t=new Date(mon);t.setDate(mon.getDate()+i);\n   const Y=t.getFullYear(),M=t.getMonth()+1,D=t.getDate();\n   const l=idx[key(Y,M,D)]||[];\n   box.appendChild(el('h3',null,fmt(Y,M,D)+' ('+l.length+')'));\n   l.forEach(a=>box.appendChild(mkItem(a.label)));\n  }\n }\n}\nfunction drawCal(){\n const [y,mo]=MONTHS[view];\n $('mt').textContent=MN[mo-1]+' '+y;\n const c=$('cal');c.innerHTML='';\n DN.forEach(n=>c.appendChild(el('div','dn',n.slice(0,3))));\n const first=(new Date(y,mo-1,1).getDay()+6)%7;\n for(let i=0;i<first;i++)c.appendChild(el('i'));\n const n=new Date(y,mo,0).getDate();\n for(let d=1;d<=n;d++){\n  const cnt=(idx[key(y,mo,d)]||[]).length;\n  const b=el('button',cnt?'has':'',String(d));\n  if(cnt){b.appendChild(el('small',null,cnt))}\n  if($('d').value===iso(y,mo,d))b.classList.add('sel');\n  b.onclick=()=>{$('d').value=iso(y,mo,d);upd()};\n  c.appendChild(b);\n }\n $('pm').disabled=view===0;$('nm').disabled=view===MONTHS.length-1;\n}\nfunction upd(){\n const v=$('d').value;\n {const q=/^(\\d{4})-(\\d{2})-(\\d{2})$/.exec(v);$('tvd').textContent=q?fmt(+q[1],+q[2],+q[3]):''}\n const m=/^(\\d{4})-(\\d{2})/.exec(v);\n if(m){const i=MONTHS.findIndex(a=>a[0]===+m[1]&&a[1]===+m[2]);if(i>=0)view=i}\n show(v);drawCal();\n}\nfunction shift(n){\n const v=$('d').value;if(!v)return;\n const dt=new Date(v+'T00:00:00');dt.setDate(dt.getDate()+n);\n $('d').value=iso(dt.getFullYear(),dt.getMonth()+1,dt.getDate());upd();\n}\n$('d').addEventListener('input',upd);\n$('prev').onclick=()=>shift(-1);$('next').onclick=()=>shift(1);\nfunction goMonth(n){\n const t=view+n;if(t<0||t>=MONTHS.length)return;\n const [y,mo]=MONTHS[t];\n const cur=/^\\d{4}-\\d{2}-(\\d{2})$/.exec($('d').value);\n const nb=new Date(y,mo,0).getDate();\n const day=Math.min(cur?+cur[1]:1,nb);\n $('d').value=iso(y,mo,day);upd();\n}\n$('pm').onclick=()=>goMonth(-1);\n$('nm').onclick=()=>goMonth(1);\n// calendrier complet\nfunction renderStatic(){\n const f=$('full');f.innerHTML='';\n DATA.groups.forEach(g=>{\n  f.appendChild(el('h2',null,g.title));\n  const t=el('table');const h=el('tr');\n  DATA.header.forEach(x=>h.appendChild(el('th',null,x)));\n  t.appendChild(h);\n  g.rows.forEach(r=>{const tr=el('tr');r.forEach((x,i)=>tr.appendChild(el('td',i?'':'lab',x)));t.appendChild(tr)});\n  f.appendChild(t);\n });\n const n=$('notes');n.innerHTML='';DATA.notes.forEach(x=>n.appendChild(el('p',null,x)));\n}\nrenderStatic();\nconst nz=s=>s.normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toLowerCase().replace(/\\s+/g,' ');\nTYPES.forEach(t=>{const s=el('span');const i=el('i');i.style.background=t[2];s.appendChild(i);s.appendChild(document.createTextNode(t[0]));$('lg').appendChild(s)});\nconst todayIso=()=>{const n=new Date();return iso(n.getFullYear(),n.getMonth()+1,n.getDate())};\n$('td').onclick=()=>{$('d').value=todayIso();upd()};\n$('wk').addEventListener('change',upd);\nfunction dl(n,rows){const s='\\ufeff'+rows.map(r=>r.map(c=>'\"'+String(c).replace(/\"/g,'\"\"')+'\"').join(';')).join('\\r\\n');const a=el('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/csv;charset=utf-8'}));a.download=n;document.body.appendChild(a);a.click();a.remove()}\nfunction tv(on){document.body.classList.toggle('tv',on);$('xt').hidden=!on;$('tvn').hidden=!on;if(on){$('d').value=todayIso();upd();try{const p=document.documentElement.requestFullscreen();if(p&&p.catch)p.catch(()=>{})}catch(e){}}else if(document.fullscreenElement){document.exitFullscreen()}}\n$('tv').onclick=()=>tv(true);$('xt').onclick=()=>tv(false);\n$('tp').onclick=()=>shift(-1);$('tn').onclick=()=>shift(1);$('tt').onclick=()=>{$('d').value=todayIso();upd()};\ndocument.addEventListener('keydown',e=>{if(!document.body.classList.contains('tv'))return;if(e.key==='ArrowLeft')shift(-1);else if(e.key==='ArrowRight')shift(1);else if(e.key==='Escape'&&!document.fullscreenElement)tv(false)});\ndocument.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&document.body.classList.contains('tv'))tv(false)});\nlet lastDay=todayIso();\nsetInterval(()=>{const t=todayIso();if(t!==lastDay){const wasToday=$('d').value===lastDay;lastDay=t;if(wasToday){$('d').value=t;upd()}}},60000);\nconst now=new Date();\nconst today=iso(now.getFullYear(),now.getMonth()+1,now.getDate());\n$('d').value=MONTHS.some(a=>a[0]===now.getFullYear()&&a[1]===now.getMonth()+1)?today:iso(MONTHS[0][0],MONTHS[0][1],1);\nupd();\n<\/script>\n<\/body>\n<\/html>\n";

 async put(id,b){await this.ready;if(!this.o){this.m[id]=b;return 0}const x=await this.tx("readwrite",s=>s.put(b,id));if(x===null){this.m[id]=b;return 0}return 1},

/* ---------- Conférence de la mise en état ---------- */
const CML=()=>S.cme||(S.cme=[]),CMT=["Sociale","Civile","Commerciale"],cmsort=L=>L.sort((a,b)=>(b.date||"").localeCompare(a.date||"")||String(b.imp).localeCompare(String(a.imp))),cmtit=(c,d)=>"Conférence de la mise en état "+c+(d?" du "+fd(d):"");
let CME=null;
const cmsel=(id,v)=>`<select id="${id}"><option value="">— Choisir —</option>${CMT.map(c=>`<option${c==v?" selected":""}>${c}</option>`).join("")}</select>`;
function cme(){return `<h2>Conférence de la mise en état</h2><p>Consultez les listes des conférences de la mise en état (Sociale, Civile, Commerciale) publiées par le greffe. Touchez « Consulter » pour lire la liste complète sur votre téléphone.</p><div class="np"><button onclick="print()">🖨️ Imprimer la liste</button></div><p class="np"><small>L’ajout, la modification et la suppression sont réservés à l’administration.</small></p><div class="w" id="cml"></div>`}
function cmtable(L,adm){return L.length?`<table class="rt"><tr><th>Conférence</th><th>Type</th><th>Date</th><th class="np">Actions</th></tr>`+L.map(r=>`<tr><td data-l="Conférence"><b>${E(r.titre)}</b></td><td data-l="Type"><span class="tag bl">${E(r.cat)}</span></td><td data-l="Date">${r.date?fd2(r.date):"—"}</td><td class="np">${r.nom?`<button class="p" onclick="vr('${r.id}')">Consulter</button>`:(adm?"":"<small>Disponible au greffe</small>")}${adm?` <button onclick="ecm('${r.id}')">Modifier</button> <button class="d" onclick="dcm('${r.id}')">${dc=="m"+r.id?"Confirmer ?":"Suppr."}</button>`:""}</td></tr>`).join("")+"</table>":`<div class="card">Aucune conférence de la mise en état publiée pour le moment.</div>`}
function lCM(){$("#cml").innerHTML=cmtable(cmsort(CML().slice()),false)}
function cmform(){return `<div class="card np"><b>Ajouter une Conférence de la mise en état</b><div class="g"><div><label>Type *</label>${cmsel("cm_c","")}</div><div><label>Date de la conférence *</label><input id="cm_d" type="date" value="${td()}"></div><div><label>Titre (facultatif)</label><input id="cm_t" placeholder="Ex. : Conférence de la mise en état Sociale du jeudi 09 juillet 2026"></div><div><label>Liste (facultatif) — Word, Excel, PDF, image</label><input id="cm_f" type="file" accept="${FACC}"></div></div><button class="p" onclick="icm()">Ajouter</button> <small>Word (.docx) et Excel (.xlsx) sont lisibles directement sur téléphone. Sans fichier, la conférence est seulement annoncée comme disponible au greffe.</small></div>`}
function cmedit(e){return `<div class="card np"><b>Modifier la conférence</b><div class="g"><div><label>Type *</label>${cmsel("ce_c",e.cat)}</div><div><label>Date de la conférence *</label><input id="ce_d" type="date" value="${E(e.date)}"></div><div><label>Titre</label><input id="ce_t" value="${E(e.titre)}"></div><div><label>Remplacer la liste jointe (facultatif)${e.nom?" — actuelle : "+E(e.nom):""}</label><input id="ce_f" type="file" accept="${FACC}"></div></div><button class="p" onclick="scm()">Enregistrer</button> <button onclick="CME=null;render()">Annuler</button></div>`}
function cmtab(){const e=CME&&CML().find(x=>x.id==CME);return `<h3>Conférence de la mise en état (${CML().length})</h3>`+pubcard()+cmform()+(e?cmedit(e):"")+`<div class="w">${cmtable(cmsort(CML().slice()),true)}</div>`}
async function icm(){if(!cs())return;const c=$("#cm_c").value,d=$("#cm_d").value,t=$("#cm_t").value.trim(),f=$("#cm_f").files[0];
 if(!c){alert("Choisissez le type de conférence (Sociale, Civile ou Commerciale).");return}if(!d){alert("Indiquez la date de la conférence.");return}
 const id="m"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),a={id,cat:c,date:d,titre:t||cmtit(c,d),chambre:"Conférence de la mise en état — "+c,imp:new Date().toISOString()};
 if(f){const x=await afile(id,f);if(!x)return;Object.assign(a,x)}
 CML().push(a);log("Conférence de la mise en état ajoutée : "+a.titre);render()}
function ecm(id){CME=id;render()}
async function scm(){if(!cs())return;const e=CML().find(x=>x.id==CME);if(!e)return;const c=$("#ce_c").value,d=$("#ce_d").value,t=$("#ce_t").value.trim(),f=$("#ce_f").files[0];
 if(!c||!d){alert("Le type et la date sont obligatoires.");return}
 if(f){const x=await afile(e.id,f);if(!x)return;Object.assign(e,x)}
 Object.assign(e,{cat:c,date:d,titre:t||cmtit(c,d),chambre:"Conférence de la mise en état — "+c});CME=null;log("Conférence de la mise en état modifiée : "+e.titre);render()}
function dcm(id){if(!cs())return;if(dc!="m"+id){dc="m"+id;render();return}dc="";const a=CML().find(x=>x.id==id);S.cme=CML().filter(x=>x.id!=id);DB.del(id);DB.del(id+"h");log("Conférence de la mise en état supprimée : "+(a?a.titre:id));render()}
