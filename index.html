<style>
:root{--bg:#eef2ee;--sf:#fff;--tx:#16241c;--mu:#55645b;--pr:#0b5d3b;--on:#fff;--ac:#e8b923;--bd:#cfd8d0;--rd:#b3261e;--hd:#0b3d2a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1713;--sf:#17231c;--tx:#e6efe8;--mu:#94a89b;--pr:#5cc08f;--on:#08150e;--bd:#2c3d33;--rd:#ff8f87}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1713;--sf:#17231c;--tx:#e6efe8;--mu:#94a89b;--pr:#5cc08f;--on:#08150e;--bd:#2c3d33;--rd:#ff8f87}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sf);z-index:10}
header{background:var(--hd);color:#fff;padding:16px 16px 12px;border-bottom:5px solid var(--rd)}
h1{margin:0;font:700 22px/1.2 Georgia,"Times New Roman",serif;letter-spacing:.02em}h1 i{color:var(--ac);font-style:normal}
header p{margin:4px 0 0;font-size:14px;opacity:.9}
.lg{width:56px;height:56px;object-fit:cover;border-radius:10px;vertical-align:middle;margin-right:8px}
#netgate{display:none;position:fixed;top:0;right:0;bottom:0;left:0;z-index:99999;background:var(--hd,#0b3d2a);color:#fff;align-items:center;justify-content:center;text-align:center;padding:24px}#netgate h2{color:#fff;margin:0 0 10px}#netgate p{max-width:420px;margin:0 auto 18px}#netgate button{background:var(--ac,#e8b923);color:#0b3d2a;border:0;border-radius:6px;padding:12px 22px;font-weight:700;font-size:16px;cursor:pointer}
.rpbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}.rpbar input[type=search]{flex:1 1 200px;padding:9px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--sf);color:var(--tx);font:inherit}.rpc{color:var(--mu);font-size:13px;margin-left:auto}
.rpw{overflow-x:auto;margin:0 0 16px;border:1px solid var(--bd);border-radius:8px;background:var(--sf)}.rpt{border-collapse:collapse;width:100%;min-width:1500px}
.rpt th{background:var(--hd);color:#fff;border:1px solid var(--bd);padding:8px;font-size:13px;text-align:center}.rpt th.s{background:var(--pr);color:var(--on)}
.rpt td{border:1px solid var(--bd);padding:8px;text-align:center;color:var(--tx)}.rpt td.l{text-align:left}.rpt td.d{min-width:150px}.rpt td.t{min-width:170px;white-space:pre-wrap;overflow-wrap:anywhere}.rpt td textarea{display:block;width:100%;border:0;padding:9px 8px;background:transparent;color:var(--tx);font:inherit;line-height:1.35;text-align:left;resize:none;overflow:hidden;border-radius:0;min-height:38px}.rpt td textarea:focus{outline:2px solid var(--pr);outline-offset:-2px;background:var(--bg)}.rpt td.i{padding:0}
.rpt td input{width:100%;border:0;padding:9px 8px;background:transparent;color:var(--tx);font:inherit;text-align:center;border-radius:0}.rpt td input.l{text-align:left}.rpt td input:focus{outline:2px solid var(--pr);outline-offset:-2px;background:var(--bg)}
.rpt td.x{width:44px;padding:0;text-align:center}.rpt td.x button{background:none;border:0;color:var(--rd);padding:6px 10px;font-size:16px;box-shadow:none}
header{position:relative}header h1{padding-right:46px}.hb{position:absolute;right:10px;top:12px;background:transparent;border:0;color:#fff;font-size:30px;line-height:1;padding:4px 10px;cursor:pointer;box-shadow:none}
.mbar{padding:12px 4px 0}.mback{background:var(--hd);color:#fff;border:0;border-radius:50%;width:44px;height:44px;font-size:22px;line-height:1;cursor:pointer}
.mlist{padding:6px 0 18px}.mbtn{display:block;width:78%;max-width:420px;margin:18px auto;padding:22px 12px;background:#dfe9e2;color:var(--hd);border:0;border-bottom:3px solid var(--ac);border-radius:4px;box-shadow:0 2px 5px rgba(0,0,0,.22);font:600 16px/1.2 Georgia,"Times New Roman",serif;letter-spacing:.03em;text-transform:uppercase;text-align:center;cursor:pointer}.mbtn:hover,.mbtn:active{background:var(--pr);color:#fff}
h2,h3{font-family:Georgia,"Times New Roman",serif;color:var(--pr);margin:.6em 0 .3em}
.demo{background:var(--ac);color:#1d1600;text-align:center;font-size:13px;font-weight:600;padding:6px 10px}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:var(--sf);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
nav button{flex:none}
main{max-width:860px;margin:0 auto;padding:12px 14px}
button{font:inherit;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:8px;padding:10px 14px;cursor:pointer;min-height:44px;margin:2px 0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--ac);outline-offset:1px}
button.p,nav button.on{background:var(--pr);color:var(--on);border-color:var(--pr)}
button.d{color:var(--rd)}
.card{background:var(--sf);border:1px solid var(--bd);border-left:4px solid var(--pr);border-radius:6px;padding:12px 14px;margin:10px 0}
.big{display:block;width:100%;text-align:left;margin:10px 0;padding:16px;border-left:4px solid var(--ac)}.big b{display:block;font-size:18px}.big span{color:var(--mu);font-size:14px}
input,select,textarea{font:inherit;width:100%;padding:10px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);margin:4px 0 10px}
label{font-size:14px;color:var(--mu)}
.g{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--bd);color:var(--tx)}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}td,th{border-bottom:1px solid var(--bd);padding:6px;text-align:left}
details{border-bottom:1px solid var(--bd);padding:8px 0}summary{cursor:pointer;font-weight:600}
.tabs{display:flex;gap:6px;overflow-x:auto}.tabs button{flex:none}
footer{max-width:860px;margin:0 auto;padding:10px 14px 28px;color:var(--mu);font-size:13px}
.rt th{color:var(--pr);font-size:12px;text-transform:uppercase}.tag.bl{background:#dbe7fb;color:#12306b;font-weight:700}
.mdl{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;padding:12px}.mb{background:var(--sf);margin:auto;width:100%;max-width:900px;height:100%;display:flex;flex-direction:column;border-radius:8px;overflow:hidden}.mh{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;gap:8px}.mb iframe{flex:1;border:0;width:100%}.mb img{max-width:100%;margin:auto;min-height:0;object-fit:contain}
.calf{display:block;width:100%;border:0}
.mq{overflow:hidden;white-space:nowrap}.mq span{display:inline-block;padding-left:100%;animation:mqr 16s linear infinite}@keyframes mqr{from{transform:translateX(0)}to{transform:translateX(-100%)}}
@media (prefers-reduced-motion:reduce){.mq{white-space:normal}.mq span{animation:none;padding-left:0}}
.vb{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:6px 12px;border-bottom:1px solid var(--bd)}.vb input{flex:1;min-width:150px;margin:0}.vb span{font-size:13px;color:var(--mu)}.vs{padding:0 12px 6px;font-size:13px;color:var(--mu)}.im{flex:1;overflow:auto;text-align:center;touch-action:pan-x pan-y pinch-zoom}.im img{max-width:none;width:100%}.mb iframe{background:#fff}.mh span{white-space:nowrap}
abutton.bt{background:transparent;cursor:pointer;font:inherit;font-size:14px}.bt{display:inline-block;border:1px solid var(--pr);color:var(--pr);border-radius:8px;padding:10px 12px;text-decoration:none;font-size:14px;margin-right:4px}
@media screen and (max-width:600px){table.rt,table.rt tbody{display:block}table.rt tr:first-child{display:none}table.rt tr{display:block;border:1px solid var(--bd);border-left:4px solid var(--pr);border-radius:6px;padding:8px 10px;margin:8px 0;background:var(--sf)}table.rt td{display:block;border:0;padding:2px 0}table.rt td[data-l]::before{content:attr(data-l) " : ";color:var(--mu);font-size:12px}.mh{flex-wrap:wrap}}
@media print{nav,.demo,.np,footer{display:none}body{background:#fff;color:#000}}

ion key(y,m,d){return y+'-'+m+'-'+d}\nfunction el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}\nconst TYPES=[['Instruction',/instruction/,'#6b4e9b'],['Civiles',/civile/,'#1f6fb2'],['Commerciales',/commerciale/,'#c27a12'],['Correctionnelles',/correctionnelle/,'#b3261e'],['Sociales',/sociale/,'#1d6b3a'],['Autres chambres',/appel|arbitrage|enfants/,'#0e7c86'],['Premier Président',/./,'#a67c00']];\nconst colOf=l=>{const s=nz(l);return (TYPES.find(t=>t[1].test(s))||TYPES[6])[2]};\nfunction mkItem(l){const e=el('div','item',l);e.style.setProperty('--k',colOf(l));return e}\nfunction fmt(y,mo,d){const dt=new Date(y,mo-1,d);return DN[(dt.getDay()+6)%7]+' '+d+' '+MN[mo-1]+' '+y}\nconst per=()=>{const a=MONTHS[0],b=MONTHS[MONTHS.length-1];return MN[a[1]-1]+' '+a[0]+' à '+MN[b[1]-1]+' '+b[0]};\nlet view=0;\nfunction show(v){\n const box=$('res');box.innerHTML='';\n box.appendChild(el('h2',null,'Audiences prévues'));\n const m=/^(\\d{4})-(\\d{2})-(\\d{2})$/.exec(v);\n if(!m){box.appendChild(el('div','msg','Veuillez saisir une date valide.'));return}\n const y=+m[1],mo=+m[2],d=+m[3];\n const dt=new Date(y,mo-1,d);\n box.appendChild(el('p',null,DN[(dt.getDay()+6)%7]+' '+d+' '+MN[mo-1]+' '+y));\n const inR=MONTHS.some(a=>a[0]===y&&a[1]===mo);\n if(!inR){box.appendChild(el('div','msg','Cette date est hors de la période couverte par le calendrier ('+per()+').'));return}\n const list=idx[key(y,mo,d)]||[];\n if(!list.length)box.appendChild(el('div','msg','Aucune audience prévue à cette date dans le calendrier.'));\n DATA.groups.forEach((g,gi)=>{\n  const l=list.filter(a=>a.g===gi);\n  if(!l.length)return;\n  box.appendChild(el('h3',null,g.title));\n  l.forEach(a=>box.appendChild(mkItem(a.label)));\n });\n if($('wk').checked){\n  const mon=new Date(y,mo-1,d);mon.setDate(mon.getDate()-((mon.getDay()+6)%7));\n  box.appendChild(el('h2','wkh','Audiences de la semaine'));\n  for(let i=0;i<5;i++){\n   const t=new Date(mon);t.setDate(mon.getDate()+i);\n   const Y=t.getFullYear(),M=t.getMonth()+1,D=t.getDate();\n   const l=idx[key(Y,M,D)]||[];\n   box.appendChild(el('h3',null,fmt(Y,M,D)+' ('+l.length+')'));\n   l.forEach(a=>box.appendChild(mkItem(a.label)));\n  }\n }\n}\nfunction drawCal(){\n const [y,mo]=MONTHS[view];\n $('mt').textContent=MN[mo-1]+' '+y;\n const c=$('cal');c.innerHTML='';\n DN.forEach(n=>c.appendChild(el('div','dn',n.slice(0,3))));\n const first=(new Date(y,mo-1,1).getDay()+6)%7;\n for(let i=0;i<first;i++)c.appendChild(el('i'));\n const n=new Date(y,mo,0).getDate();\n for(let d=1;d<=n;d++){\n  const cnt=(idx[key(y,mo,d)]||[]).length;\n  const b=el('button',cnt?'has':'',String(d));\n  if(cnt){b.appendChild(el('small',null,cnt))}\n  if($('d').value===iso(y,mo,d))b.classList.add('sel');\n  b.onclick=()=>{$('d').value=iso(y,mo,d);upd()};\n  c.appendChild(b);\n }\n $('pm').disabled=view===0;$('nm').disabled=view===MONTHS.length-1;\n}\nfunction upd(){\n const v=$('d').value;\n {const q=/^(\\d{4})-(\\d{2})-(\\d{2})$/.exec(v);$('tvd').textContent=q?fmt(+q[1],+q[2],+q[3]):''}\n const m=/^(\\d{4})-(\\d{2})/.exec(v);\n if(m){const i=MONTHS.findIndex(a=>a[0]===+m[1]&&a[1]===+m[2]);if(i>=0)view=i}\n show(v);drawCal();\n}\nfunction shift(n){\n const v=$('d').value;if(!v)return;\n const dt=new Date(v+'T00:00:00');dt.setDate(dt.getDate()+n);\n $('d').value=iso(dt.getFullYear(),dt.getMonth()+1,dt.getDate());upd();\n}\n$('d').addEventListener('input',upd);\n$('prev').onclick=()=>shift(-1);$('next').onclick=()=>shift(1);\nfunction goMonth(n){\n const t=view+n;if(t<0||t>=MONTHS.length)return;\n const [y,mo]=MONTHS[t];\n const cur=/^\\d{4}-\\d{2}-(\\d{2})$/.exec($('d').value);\n const nb=new Date(y,mo,0).getDate();\n const day=Math.min(cur?+cur[1]:1,nb);\n $('d').value=iso(y,mo,day);upd();\n}\n$('pm').onclick=()=>goMonth(-1);\n$('nm').onclick=()=>goMonth(1);\n// calendrier complet\nfunction renderStatic(){\n const f=$('full');f.innerHTML='';\n DATA.groups.forEach(g=>{\n  f.appendChild(el('h2',null,g.title) t t=todayIso();if(t!==lastDay){const wasToday=$('d').value===lastDay;lastDay=t;if(wasToday){$('d').value=t;upd()}}},60000);\nconst now=new Date();\nconst today=iso(now.getFullYear(),now.getMonth()+1,now.getDate());\n$('d').value=MONTHS.some(a=>a[0]===now.getFullYear()&&a[1]===now.getMonth()+1)?today:iso(MONTHS[0][0],MONTHS[0][1],1);\nupd();\n<\/script>\n<\/body>\n<\/html>\n";

if(PUBM&&/^https?:/.test(location.protocol)){(function(){
 const g=document.createElement("div");g.id="netgate";document.body.appendChild(g);
 let busy=false;
 function msg(t,d,b){g.innerHTML="<div><h2>"+t+"</h2><p>"+d+"</p>"+(b?'<button id="netretry">Réessayer</button>':"")+"</div>";g.style.display="flex";const r=g.querySelector("#netretry");if(r)r.onclick=()=>run(false)}
 function fail(){msg("Connexion internet requise","Cette application fonctionne uniquement avec une connexion internet. Vérifiez votre connexion, puis touchez « Réessayer ».",true)}
 function run(silent){if(busy)return;if(navigator.onLine===false){fail();return}
  busy=true;if(!silent)msg("Vérification de la connexion…","",false);
  const ac=window.AbortController?new AbortController():null,tm=setTimeout(()=>{if(ac)ac.abort()},8000);
  fetch(location.pathname+"?_="+Date.now(),{method:"HEAD",cache:"no-store",signal:ac?ac.signal:undefined}).then(r=>{if(!r.ok)throw 0;g.style.display="none"}).catch(fail).then(()=>{clearTimeout(tm);busy=false})}
 addEventListener("offline",fail);addEventListener("online",()=>run(false));addEventListener("pageshow",()=>run(true));
 document.addEventListener("visibilitychange",()=>{if(!document.hidden)run(true)});
 setInterval(()=>{if(!document.hidden)run(true)},30000);
 run(false)})()}
