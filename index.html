<style>
:root{--bg:#eef2ee;--sf:#fff;--tx:#16241c;--mu:#55645b;--pr:#0b5d3b;--on:#fff;--ac:#e8b923;--bd:#cfd8d0;--rd:#b3261e;--hd:#0b3d2a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1713;--sf:#17231c;--tx:#e6efe8;--mu:#94a89b;--pr:#5cc08f;--on:#08150e;--bd:#2c3d33;--rd:#ff8f87}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1713;--sf:#17231c;--tx:#e6efe8;--mu:#94a89b;--pr:#5cc08f;--on:#08150e;--bd:#2c3d33;--rd:#ff8f87}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sf);z-index:10}
header{background:var(--hd);color:#fff;padding:16px 16px 12px;border-bottom:5px solid var(--rd)}
h1{margin:0;font:700 22px/1.2 Georgia,"Times New Roman",serif;letter-spacing:.02em}h1 i{color:var(--ac);font-style:normal}
header p{margin:4px 0 0;font-size:14px;opacity:.9}
.lg{width:56px;height:56px;object-fit:cover;border-radius:10px;vertical-align:middle;margin-right:8px}
#netgate{display:none;position:fixed;top:0;right:0;bottom:0;left:0;z-index:99999;background:var(--hd,#0b3d2a);color:#fff;align-items:center;justify-content:center;text-align:center;padding:24px}#netgate h2{color:#fff;margin:0 0 10px}#netgate p{max-width:420px;margin:0 auto 18px}#netgate button{background:var(--ac,#e8b923);color:#0b3d2a;border:0;border-radius:6px;padding:12px 22px;font-weight:700;font-size:16px;cursor:pointer}
.rpbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}.rpbar input[type=search]{flex:1 1 200px;padding:9px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--sf);color:var(--tx);font:inherit}.rpc{color:var(--mu);font-size:13px;margin-left:auto}
.rpw{overflow-x:auto;margin:0 0 16px;border:1px solid var(--bd);border-radius:8px;background:var(--sf)}.rpt{border-collapse:collapse;width:100%;min-width:1500px}
.rpt th{background:var(--hd);color:#fff;border:1px solid var(--bd);padding:8px;font-size:13px;text-align:center}.rpt th.s{background:var(--pr);color:var(--on)}
.rpt td{border:1px solid var(--bd);padding:8px;text-align:center;color:var(--tx)}.rpt td.l{text-align:left}.rpt td.d{min-width:150px}.rpt td.t{min-width:170px;white-space:pre-wrap;overflow-wrap:anywhere}.rpt td textarea{display:block;width:100%;border:0;padding:9px 8px;background:transparent;color:var(--tx);font:inherit;line-height:1.35;text-align:left;resize:none;overflow:hidden;border-radius:0;min-height:38px}.rpt td textarea:focus{outline:2px solid var(--pr);outline-offset:-2px;background:var(--bg)}.rpt td.i{padding:0}
.rpt td input{width:100%;border:0;padding:9px 8px;background:transparent;color:var(--tx);font:inherit;text-align:center;border-radius:0}.rpt td input.l{text-align:left}.rpt td input:focus{outline:2px solid var(--pr);outline-offset:-2px;background:var(--bg)}
.rpt td.x{width:44px;padding:0;text-align:center}.rpt td.x button{background:none;border:0;color:var(--rd);padding:6px 10px;font-size:16px;box-shadow:none}
header{position:relative}header h1{padding-right:46px}.hb{position:absolute;right:10px;top:12px;background:transparent;border:0;color:#fff;font-size:30px;line-height:1;padding:4px 10px;cursor:pointer;box-shadow:none}
.mbar{padding:12px 4px 0}.mback{background:var(--hd);color:#fff;border:0;border-radius:50%;width:44px;height:44px;font-size:22px;line-height:1;cursor:pointer}
.mlist{padding:6px 0 18px}.mbtn{display:block;width:78%;max-width:420px;margin:18px auto;padding:22px 12px;background:#dfe9e2;color:var(--hd);border:0;border-bottom:3px solid var(--ac);border-radius:4px;box-shadow:0 2px 5px rgba(0,0,0,.22);font:600 16px/1.2 Georgia,"Times New Roman",serif;letter-spacing:.03em;text-transform:uppercase;text-align:center;cursor:pointer}.mbtn:hover,.mbtn:active{background:var(--pr);color:#fff}
h2,h3{font-family:Georgia,"Times New Roman",serif;color:var(--pr);margin:.6em 0 .3em}
.demo{background:var(--ac);color:#1d1600;text-align:center;font-size:13px;font-weight:600;padding:6px 10px}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:var(--sf);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
nav button{flex:none}
main{max-width:860px;margin:0 auto;padding:12px 14px}
button{font:inherit;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:8px;padding:10px 14px;cursor:pointer;min-height:44px;margin:2px 0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--ac);outline-offset:1px}
button.p,nav button.on{background:var(--pr);color:var(--on);border-color:var(--pr)}
button.d{color:var(--rd)}
.card{background:var(--sf);border:1px solid var(--bd);border-left:4px solid var(--pr);border-radius:6px;padding:12px 14px;margin:10px 0}
.big{display:block;width:100%;text-align:left;margin:10px 0;padding:16px;border-left:4px solid var(--ac)}.big b{display:block;font-size:18px}.big span{color:var(--mu);font-size:14px}
input,select,textarea{font:inherit;width:100%;padding:10px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);margin:4px 0 10px}
label{font-size:14px;color:var(--mu)}
.g{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--bd);color:var(--tx)}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}td,th{border-bottom:1px solid var(--bd);padding:6px;text-align:left}
details{border-bottom:1px solid var(--bd);padding:8px 0}summary{cursor:pointer;font-weight:600}
.tabs{display:flex;gap:6px;overflow-x:auto}.tabs button{flex:none}
footer{max-width:860px;margin:0 auto;padding:10px 14px 28px;color:var(--mu);font-size:13px}
.rt th{color:var(--pr);font-size:12px;text-transform:uppercase}.tag.bl{background:#dbe7fb;color:#12306b;font-weight:700}
.mdl{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;padding:12px}.mb{background:var(--sf);margin:auto;width:100%;max-width:900px;height:100%;display:flex;flex-direction:column;border-radius:8px;overflow:hidden}.mh{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;gap:8px}.mb iframe{flex:1;border:0;width:100%}.mb img{max-width:100%;margin:auto;min-height:0;object-fit:contain}
.calf{display:block;width:100%;border:0}
.mq{overflow:hidden;white-space:nowrap}.mq span{display:inline-block;padding-left:100%;animation:mqr 16s linear infinite}@keyframes mqr{from{transform:translateX(0)}to{transform:translateX(-100%)}}
@media (prefers-reduced-motion:reduce){.mq{white-space:normal}.mq span{animation:none;padding-left:0}}
.vb{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:6px 12px;border-bottom:1px solid var(--bd)}.vb input{flex:1;min-width:150px;margin:0}.vb span{font-size:13px;color:var(--mu)}.vs{padding:0 12px 6px;font-size:13px;color:var(--mu)}.im{flex:1;overflow:auto;text-align:center;touch-action:pan-x pan-y pinch-zoom}.im img{max-width:none;width:100%}.mb iframe{background:#fff}.mh span{white-space:nowrap}
abutton.bt{background:transparent;cursor:pointer;font:inherit;font-size:14px}.bt{display:inline-block;border:1px solid var(--pr);color:var(--pr);border-radius:8px;padding:10px 12px;text-decoration:none;font-size:14px;margin-right:4px}
@media screen and (max-width:600px){table.rt,table.rt tbody{display:block}table.rt tr:first-child{display:none}table.rt tr{display:block;border:1px solid var(--bd);border-left:4px solid var(--pr);border-radius:6px;padding:8px 10px;margin:8px 0;background:var(--sf)}table.rt td{display:block;border:0;padding:2px 0}table.rt td[data-l]::before{content:attr(data-l) " : ";color:var(--mu);font-size:12px}.mh{flex-wrap:wrap}}
@media print{nav,.demo,.np,footer{display:none}body{background:#fff;color:#000}}

<script>window.PUB={"v":1794963751953,"S":{"maj":"2026-11-18","cour":{"adresse":"Cour d’appel de Ouagadougou, Ouagadougou","tel":"+226 00 00 00 00","hor":"Lun–Jeu 7h30–12h30 et 13h–16h et Ven· 7h30–12h30 et 13h–16h30","note":"salut"},"audiences":[],"services":[{"nom":"Greffe de la chambre de l'instruction","role":"La chambre de l'instruction, examine les appels formés contre certaines ordonnances rendues par les juges d'instruction. Contrôle la régularité de la procédure et examine les éventuelles irrégularités. Examine les demande relatives à la détention provisoire, dans les cas prévus par la loi. Apprécie les charges réunies contre une personne mise en examen. Statue sur le renvoi devant la juridiction de jugement ou non-lieu, lorsque la loi lui attribue cette compétence. Statue sur les nullités de la procédure lorsque les condition légales sont réunies.","lieu":"Côté droit, 2ème, bureau N°49","horaires":"","contact":"Pas de contact"},{"nom":"Greffe de la chambre correctionnelle","role":"La chambre correctionnelle, réexamine les décisions rendues en matière délictuelle et contraventionnelle par les juridictions de premier degré, lorsque ces décisions font l'objet d'un appel recevable.","lieu":"Côté gauche,3ème étage, Bureau N°03","horaires":"Lun–Ven 7h30–12h30 et 13h–16h","contact":"pas de contact"},{"nom":"Greffe des Référés","role":"La juridiction de Premier Président, examine les appels formés contre les ordonnances de référé rendues par les juridictions de première instance. Ordonne les mesures provisoire en cas d'urgence, lorsque les conditions sont réunies. Examine les demandes relatives à la suspension ou à la défense  de l'exécution provisoire, dans les conditions prévues pars la loi. Statue sur certaines difficultés d'exécution relevant de sa compétence.","lieu":"Côté gauche, 3ème étage, Bureau N°10","horaires":"Lun–Ven 7h30–12h30 et 13h–16h","contact":"pas de contact"},{"nom":"Greffe de la chambre criminelle/Anti-Terrorisme","role":"La chambre criminelle;  juridiction de second degré(d'appel) pour les décisions rendues par les chambres criminelles des tribunaux de grande instance (TGI). Elle a la possibilité d'infirmer un jugement dans le favorables à l'accusé sur son seul appel","lieu":"Côté droit, 3ème étage, Bureau N°44","horaires":"Lun–Ven 7h30–12h30 et 13h30–16h","contact":"Pas de contact"},{"nom":"Greffe de la chambre sociale","role":"La chambre sociale examine les recours(appel) formés contre les jugement relatifs aux litiges individuels ou collectifs nés de l'exécutions de la rupture ou de la résiliation du contrat de travail(licenciements, salaires, primes, indemnités, etc.). Elle vérifie si le tribunal du travail a fait une application correcte de la législation sociale et du Code du travail burkinabé.","lieu":"Côté gauche, 3ème étage , bureau N°02","horaires":"Lun-Ven 7h30-12h30 et 13h30-16h","contact":"Pas de contact"},{"nom":"Greffe de la chambre civile","role":"La chambre civile, juridiction de seconde degré chargée de réexaminer et de juger à nouveau les décisions rendues en premier ressort en matière civile(litige entre particuliers, contrats, responsabilité civile, droit de la famille , successions, etc...) par les juridictions inférieures de son ressort. Telles que les Tribunaux de Grande instance. Elle examine les appels formés contre les jugement civile rendus en première instance pour les confirmer (si le jugement est jugé correct) ou les infirmer/modifier (si une erreur de droit ou d'appréciation des faits est constée)","lieu":"Côté gauche,3ème étage bureau N°05","horaires":"Lun-Ven 7h30-12h-30 et 13h30-16h","contact":"Pas de contact"},{"nom":"Greffe de la chambre commerciale.","role":"La chambre commerciale, statue sur les recours(appels) formés contre les jugements et ordonnances rendus en premier ressort par les juridictions commerciales (comme les tribunaux de commerce) relevant de sa compétence. Elle traite des litiges portant sur les engagements et transactions entre commerçants ou établissements de crédit, les conflits relatifs aux sociétés commerciales , ainsi que les actes et effets de commerce régis par le droits de l'OHADA. Elle connaît des procédures urgentes(référés) et des difficultés liées à l'exécution des décisions qu'elle rend ou qui lui sont soumises.","lieu":"Côté droit, 2ème étage, bureau N°51","horaires":"Lun-Ven 7h30-12h30 et 13h30-16h","contact":"pas de contact"},{"nom":"Greffe de la chambre d’Appel pôle ECOFI","role":"La chambre Pôle ECOFI examine les appels contre les décisions rendues par les juridictions spécialisées du Pôle ECOFI. Réexamine les affaires économiques et financières relevant de sa compétence. Contrôle, au second degré, l'instruction des dossiers concernés. Vérifier l'application correcte de la loi pénale. Confirme, infirme ou réforme les décisions attaquées","lieu":"Côté gauche, 3ème étage, bureau N°03","horaires":"Lun-Ven 7h30-12h30 et 13h30h-16h","contact":"Pas de contact"},{"nom":"Greffe, chambre pour enfant","role":"La chambre pour enfant, examine les recours contre les ordonnances ou jugements pris par le juge des enfants ou le tribunal pour enfants concernant les mesures de protection, d'assistance, d'éducation ou de rééducation, ainsi que les délits commis par des  mineurs","lieu":"Côté gauche, 2ème étage, bureau N°17","horaires":"Lin-Ven, 07h30-12h30 et 13h30-16h","contact":"pas de contact"}],"dossiers":[{"num":"DEMO-2026-001","code":"DEMO-1234","statut":"En cours","prochaine":"2026-10-28","service":"Greffe civil"},{"num":"DEMO-2026-002","code":"DEMO-2345","statut":"Audience fixée","prochaine":"2026-10-21","service":"Greffe pénal"},{"num":"DEMO-2026-003","code":"DEMO-3456","statut":"Délibéré","prochaine":"2026-11-01","service":"Greffe civil"},{"num":"DEMO-2026-004","code":"DEMO-4567","statut":"Décision rendue","prochaine":"","service":"Copies et expéditions"},{"num":"DEMO-2026-005","code":"DEMO-5678","statut":"En cours","prochaine":"","service":"Greffe pénal"},{"num":"098/2026 du 12/02/2026 ,MPc/OUEDRAOGO Ali","code":"RG23","statut":"Délibéré","prochaine":"2026-10-24","service":"Chambre correctionnelle"}],"faq":[{"q":"Quels sont les horaires d’ouverture ?","r":"Du lundi au jeudi, de 7h30 à 12h30 puis de 13h30 à 16h. et vendredi, 7h30 à 12h30 puis de 13h30 à 16h30."},{"q":"Où trouver le service d’accueil ?","r":"Au rez-de-chaussée, près de l’entrée principale. Les agents vous orientent vers le bon service."},{"q":"Puis-je connaître la date de mon audience ?","r":"Oui, si le rôle est publiable : consultez le Rôles d'audiences. Sinon, adressez-vous au greffe."},{"q":"Que faire si je ne trouve pas mon dossier ?","r":"Présentez-vous au greffe afin d'avoir les informations convenables."}],"lexique":[{"t":"Greffe","d":"Service où sont déposés et conservés les actes et dossiers d’une juridiction."},{"t":"Délibéré","d":"Temps pendant lequel les juges réfléchissent avant de rendre leur décision."},{"t":"Appel","d":"Voie de recours pour demander à une juridiction supérieure de rejuger l’affaire."},{"t":"Pourvoi","d":"Recours contre une décision définitive, portant sur l’application du droit."},{"t":"Arrêt","d":"Décision rendue par une cour (cour d’appel, cour de cassation)."},{"t":"Renvoi","d":"Report d’une affaire à une audience ultérieure."},{"t":"Audience publique","d":"Séance ouverte au public où l’affaire est examinée."},{"t":"Casier judiciaire","d":"Fichier qui recense les condamnations d’une personne."}],"parcours":{"q":"Quel est votre besoin ?","o":[["Obtenir un document",{"q":"Quel document ?","o":[["Bulletin n°3 du casier judiciaire",{"res":{"service":"Greffe (service casier judiciaire)","lieu":"Entrée principale rez-de-chaussée","hor":"Lun–Ven 08h00–10h00","pieces":"Pièce d’identité (CINB) ou certificat de nationalité; Extrait de naissance; Une demande timbrée à (200)F cfa, (Timbre fiscal) et une somme de 500 F Cfa","etapes":"Présentez-vous au Bureau; Avec votre  demande; Prenez votre quittance après règlement  des frais; Date et l'heure de Retrait de  bulletin n° function artab(){const e=AE&&AL().find(x=>x.id==AE);return `<h3>Arrêts disponibles (${AL().length})</h3>`+pubcard()+arform()+(e?aredit(e):"")+`<div class="w">${atable(asort(AL().slice()),true)}</div>`}
const atit=n=>n,anext=()=>"Liste N°"+(Math.max(0,...AL().map(a=>{const x=/^Liste\s*N°\s*(\d+)/i.exec(String(a.numero));return x?+x[1]:0}))+1);
async function afile(id,f){if(f.size>20971520){alert("Fichier trop volumineux (20 Mo maximum).");return null}const ty=tp(f.name),h=await conv(f,f.name),ok=await DB.put(id,f);if(h)await DB.put(id+"h",h);else await DB.del(id+"h");DB.del(id+"p");{const lp=ty=="Word"?await lay1(f,f.name):null;if(lp)await DB.put(id+"p",lp);else await DB.del(id+"p")}
 if(!ok)alert("Le stockage des fichiers n’est pas disponible dans ce navigateur : le fichier ne sera pas conservé après fermeture.");
 if(!h&&(ty=="Word"||ty=="Excel"))alert("Ce fichier ne peut pas être lu directement sur téléphone (ancien format .doc/.xls ou document trop complexe) : les usagers ne pourront ni le lire ni le télécharger. Conseil : enregistrez-le en .docx ou .xlsx.");
 else if(ty=="PDF")alert("Information : certains téléphones Android ne peuvent pas afficher un PDF dans l’application ; l’usager pourra le télécharger. Pour une lecture directe dans l’application, préférez Word (.docx) : les usagers le téléchargeront alors en PDF.");
 return{nom:f.name,type:ty}}

/* ---------- Conférence de la mise en état ---------- */
const CML=()=>S.cme||(S.cme=[]),CMT=["Sociale","Civile","Commerciale"],cmsort=L=>L.sort((a,b)=>(b.date||"").localeCompare(a.date||"")||String(b.imp).localeCompare(String(a.imp))),cmtit=(c,d)=>"Conférence de la mise en état "+c+(d?" du "+fd(d):"");
let CME=null;
const cmsel=(id,v)=>`<select id="${id}"><option value="">— Choisir —</option>${CMT.map(c=>`<option${c==v?" selected":""}>${c}</option>`).join("")}</select>`;
function cme(){return `<h2>Conférence de la mise en état</h2><p>Consultez les listes des conférences de la mise en état (Sociale, Civile, Commerciale) publiées par le greffe. Touchez « Consulter » pour lire la liste complète sur votre téléphone.</p><div class="np"><button onclick="print()">🖨️ Imprimer la liste</button></div><p class="np"><small>L’ajout, la modification et la suppression sont réservés à l’administration.</small></p><div class="w" id="cml"></div>`}
function cmtable(L,adm){return L.length?`<table class="rt"><tr><th>Conférence</th><th>Type</th><th>Date</th><th class="np">Actions</th></tr>`+L.map(r=>`<tr><td data-l="Conférence"><b>${E(r.titre)}</b></td><td data-l="Type"><span class="tag bl">${E(r.cat)}</span></td><td data-l="Date">${r.date?fd2(r.date):"—"}</td><td class="np">${r.nom?`<button class="p" onclick="vr('${r.id}')">Consulter</button>`:(adm?"":"<small>Disponible au greffe</small>")}${adm?` <button onclick="ecm('${r.id}')">Modifier</button> <button class="d" onclick="dcm('${r.id}')">${dc=="m"+r.id?"Confirmer ?":"Suppr."}</button>`:""}</td></tr>`).join("")+"</table>":`<div class="card">Aucune conférence de la mise en état publiée pour le moment.</div>`}
function lCM(){$("#cml").innerHTML=cmtable(cmsort(CML().slice()),false)}
function cmform(){return `<div class="card np"><b>Ajouter une Conférence de la mise en état</b><div class="g"><div><label>Type *</label>${cmsel("cm_c","")}</div><div><label>Date de la conférence *</label><input id="cm_d" type="date" value="${td()}"></div><div><label>Titre (facultatif)</label><input id="cm_t" placeholder="Ex. : Conférence de la mise en état Sociale du jeudi 09 juillet 2026"></div><div><label>Liste (facultatif) — Word, Excel, PDF, image</label><input id="cm_f" type="file" accept="${FACC}"></div></div><button class="p" onclick="icm()">Ajouter</button> <small>Word (.docx) et Excel (.xlsx) sont lisibles directement sur téléphone. Sans fichier, la conférence est seulement annoncée comme disponible au greffe.</small></div>`}

function cmtab(){const e=CME&&CML().find(x=>x.id==CME);return `<h3>Conférence de la mise en état (${CML().length})</h3>`+pubcard()+cmform()+(e?cmedit(e):"")+`<div class="w">${cmtable(cmsort(CML().slice()),true)}</div>`}
async function icm(){if(!cs())return;const c=$("#cm_c").value,d=$("#cm_d").value,t=$("#cm_t").value.trim(),f=$("#cm_f").files[0];
 if(!c){alert("Choisissez le type de conférence (Sociale, Civile ou Commerciale).");return}if(!d){alert("Indiquez la date de la conférence.");return}
 const id="m"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),a={id,cat:c,date:d,titre:t||cmtit(c,d),chambre:"Conférence de la mise en état — "+c,imp:new Date().toISOString()};

 CML().push(a);log("Conférence de la mise en état ajoutée : "+a.titre);render()}

if("serviceWorker" in navigator&&/^https?:/.test(location.protocol)){navigator.serviceWorker.getRegistrations().then(r=>r.forEach(x=>x.unregister())).catch(()=>{});if(window.caches)caches.keys().then(k=>k.forEach(n=>caches.delete(n))).catch(()=>{})}
/* Internet obligatoire : à chaque ouverture, la connexion est vérifiée ; sans internet, un message remplace le contenu. Appliqué à la version publique en ligne uniquement. */
if(PUBM&&/^https?:/.test(location.protocol)){(function(){
 const g=document.createElement("div");g.id="netgate";document.body.appendChild(g);
 let busy=false;
 function msg(t,d,b){g.innerHTML="<div><h2>"+t+"</h2><p>"+d+"</p>"+(b?'<button id="netretry">Réessayer</button>':"")+"</div>";g.style.display="flex";const r=g.querySelector("#netretry");if(r)r.onclick=()=>run(false)}
